<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(229, 231, 235, 0.5);
        }
        .animate-subtle-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
    </style>

<body class="bg-background text-on-surface font-body-md overflow-hidden">
<div class="relative min-h-screen flex items-center justify-center p-md">
<!-- Background Animation Layer -->

<!-- Decorative Elements -->
<div class="absolute top-1/4 -left-12 w-64 h-64 bg-primary/5 rounded-full blur-3xl animate-subtle-float"></div>
<div class="absolute bottom-1/4 -right-12 w-96 h-96 bg-secondary/5 rounded-full blur-3xl animate-subtle-float" style="animation-delay: -3s"></div>
<main class="relative w-full max-w-[480px] z-10">
<!-- Login Shell -->
<div class="glass-card rounded-[24px] p-xl shadow-sm overflow-hidden">
<!-- Brand Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary mb-lg shadow-lg">
<span class="material-symbols-outlined text-white text-[32px]">school</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">UniSmart AI</h1>
<p class="font-body-md text-on-surface-variant">Faculty Portal Access</p>
</div>
<!-- Powered by AI Badge -->
<div class="flex justify-center mb-lg">
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-primary/10 border border-primary/20">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm text-primary">Powered by AI</span>
</div>
</div>
<!-- Form -->
<form class="space-y-lg">
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="faculty-id">Faculty ID or Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">badge</span>
<input class="w-full pl-12 pr-4 py-3 bg-white border border-outline-variant rounded-xl text-on-surface focus:outline-none focus:border-primary transition-all font-body-md" id="faculty-id" placeholder="e.g. FAC-29384" type="text"/>
</div>
</div>
<div class="space-y-base">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-white border border-outline-variant rounded-xl text-on-surface focus:outline-none focus:border-primary transition-all font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-3 ml-1 mb-lg">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none cursor-pointer" for="remember">Remember my station</label>
</div>
<button class="w-full py-4 bg-primary text-white font-label-md text-label-md rounded-xl shadow-lg shadow-primary/20 hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Login as Faculty
                        <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<div class="mt-xl flex flex-col gap-4">
<div class="relative">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
<div class="relative flex justify-center"><span class="px-2 bg-white/50 backdrop-blur-sm text-on-surface-variant font-label-sm">New to UniSmart?</span></div>
</div>
<button class="w-full py-3 bg-white border border-outline-variant text-on-surface font-label-md text-label-md rounded-xl hover:bg-surface-container-low transition-colors active:scale-[0.98]">
                        Request Access
                    </button>
</div>
</div>
<!-- Footer Links -->
<footer class="mt-lg flex justify-between items-center px-md text-on-surface-variant font-label-sm">
<span>© 2024 UniSmart AI</span>
<div class="flex gap-4">
<a class="hover:text-primary transition-colors" href="#">Security</a>
<a class="hover:text-primary transition-colors" href="#">Support</a>
</div>
</footer>
</main>
<!-- Right Side Atmospheric Imagery (Visible only on lg) -->
<div class="hidden lg:block absolute right-xl top-1/2 -translate-y-1/2 w-[400px] h-[600px] rounded-[32px] overflow-hidden shadow-2xl border-4 border-white/50">
<img alt="Academic Excellence" class="w-full h-full object-cover" data-alt="A high-end, professionally lit photography shot of a modern academic research office. The setting is clean and minimalist with floor-to-ceiling windows showing a blurred campus skyline. A sleek glass desk holds a modern laptop and a stack of academic journals. The overall color palette is dominated by soft whites, cool grays, and deep navy blues, reflecting a sense of intellectual rigor and technical sophistication in a premium light-mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-eNIST1N-gb3hg7c-_kiiv5Eb-MgSzMM_JDSMntNOc-I3j2m17iCUpdrS3aYtWRFrfNTc2OSsoxzZQInlmOwnGiw-DxGn-0qGt9IylYTzjfEeA_XoWmRofENklM6WpBw6AZo1F8gbZxIdkaJVzb6yE5EMEiUl1U5f3gS8o2wApUEtLXkMzrNNEwgfWmqb4wlg9m1FpSb07moZb2IQSbZiz4ISH1NTqjugXLXZUqbA3TTr9PvuGWAsKMqOElZkSNH2yGahKOa3HB6W"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent flex flex-col justify-end p-xl">
<h3 class="text-white font-headline-md text-headline-md mb-2">Empowering Educators</h3>
<p class="text-white/80 font-body-sm text-body-sm">Harness the power of predictive analytics to improve student outcomes and streamline your workflow.</p>
</div>
</div>
</div>
<script>
        // Micro-interactions for input focus effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple login simulation
        const loginForm = document.querySelector('form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Validating Credentials...';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Access Granted';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-tertiary-container');
            }, 1500);
        });
    </script>
</body></html>
