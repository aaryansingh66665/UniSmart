<style>

        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);

        }
        .animated-gradient {
            background: linear-gradient(-45deg, #4f46e5, #3525cd, #6b38d4, #8455ef);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="font-body-md text-on-surface">
<!-- Blurred Gradient Background Layer -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[50%] h-[50%] rounded-full bg-secondary/10 blur-[120px]"></div>

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex min-h-screen items-center justify-center p-lg">
<!-- Login Container -->
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Logo Anchor -->
<div class="mb-xl flex flex-col items-center gap-xs">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">UniSmart AI</h1>
<p class="font-label-md text-label-md text-on-surface-variant">Enterprise LMS Portal</p>
</div>
<!-- Login Card -->
<div class="w-full glass-panel rounded-[24px] p-xl shadow-xl shadow-primary/5">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Admin Login</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Enter your credentials to manage the academic ecosystem.</p>
</div>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">University Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-low border border-outline-variant rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all outline-none font-body-md" id="email" name="email" placeholder="admin@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-xl pr-xl py-sm bg-surface-container-low border border-outline-variant rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all outline-none font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="toggleIcon">visibility</span>
</button>
</div>
</div>
<!-- CTA Button -->
<button class="w-full py-md bg-primary text-white font-label-md text-label-md rounded-xl shadow-lg shadow-primary/20 hover:bg-primary-container hover:scale-[1.01] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                        Login as Admin
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- SSO Section -->
<div class="mt-xl pt-xl border-t border-outline-variant">

<div class="absolute inset-0 border border-primary/20 rounded-full animate-[spin_20s_linear_infinite]"></div>
<div class="absolute inset-8 border border-secondary/20 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
<div class="absolute inset-16 border border-primary/20 rounded-full animate-[spin_10s_linear_infinite]"></div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.innerText = 'visibility';
            }
        }

        // Micro-interaction: Subtle mouse parallax on the main card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-panel');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('.glass-panel');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'all 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            const card = document.querySelector('.glass-panel');
            card.style.transition = 'none';
        });
    </script>
